name: CI Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '.github/**'
      - 'docs/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '.github/**'
      - 'docs/**'

# Do not harden the runner in this workflow — build and test tasks require free network access.

permissions:
  contents: read

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build FennecLabs.slnx --configuration Debug

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: build-artifacts
          path: src/**/*.nupkg
          retention-days: 5
          if-no-files-found: ignore

      - name: Test
        run: >
          dotnet test FennecLabs.slnx
          --configuration Debug
          --no-build
          --collect:"XPlat Code Coverage"
          --settings coverage.runsettings
          --logger trx
          --results-directory TestResults

      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@d0a4676d0e0b938bc201470d88276b7c74c712b3  # v2.24.0
        if: always()
        with:
          files: TestResults/**/*.trx

      - name: Generate coverage report
        uses: danielpalme/ReportGenerator-GitHub-Action@d3ebf1f760f7d8ab92cc44d9bcfee7ad73722a31  # 5.5.11
        if: always()
        with:
          reports: TestResults/**/coverage.cobertura.xml
          targetdir: coverage-report
          reporttypes: MarkdownSummaryGithub

      - name: Write coverage summary
        if: always()
        run: cat coverage-report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: coverage-report
          path: coverage-report/
          retention-days: 5
