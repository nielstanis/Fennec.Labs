name: Prerelease

on:
  workflow_dispatch:
    inputs:
      perform_publish:
        description: 'Publish package to feedz.io'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build and Attest
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2  # v5.3.0
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build FennecLabs.slnx --configuration Release

      - name: Test
        run: >
          dotnet test FennecLabs.slnx
          --configuration Release
          --no-build
          --logger trx
          --results-directory TestResults

      - name: Pack
        run: >
          dotnet pack src/FennecLabs.Cli/Fennec.csproj
          --configuration Release
          --no-build
          --output ./artifacts/packages
          --version-suffix "preview.${{ github.run_number }}"

      - name: Attest packages
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373  # v4.1.1
        with:
          subject-path: ./artifacts/packages/*.nupkg

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: prerelease-packages
          path: ./artifacts/packages/
          retention-days: 5

  publish:
    name: Publish to feedz.io
    runs-on: ubuntu-latest
    needs: build
    if: inputs.perform_publish
    environment: prerelease
    permissions:
      contents: read

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: prerelease-packages
          path: ./artifacts/packages

      - name: Setup .NET
        uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2  # v5.3.0
        with:
          dotnet-version: '10.0.x'

      - name: Push to feedz.io
        # zizmor: ignore[use-trusted-publishing] -- feedz.io does not support OIDC trusted publishing
        env:
          FEEDZ_FEED_URL: ${{ secrets.FEEDZ_FEED_URL }}
          FEEDZ_API_KEY: ${{ secrets.FEEDZ_API_KEY }}
        run: >
          dotnet nuget push ./artifacts/packages/*.nupkg
          --source "$FEEDZ_FEED_URL"
          --api-key "$FEEDZ_API_KEY"
          --skip-duplicate
